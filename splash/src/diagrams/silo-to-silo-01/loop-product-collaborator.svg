<svg class="s2s-svg" data-diagram="loop-product-collaborator" focusable="false" viewBox="0 0 913 652" role="img" lang="en" aria-labelledby="s2s-loop-product-collaborator-archify-diagram-title s2s-loop-product-collaborator-archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="s2s-loop-product-collaborator-archify-diagram-title">The Collaborator: in-product loop (exam generation)</title>
        <desc id="s2s-loop-product-collaborator-archify-diagram-description">The Collaborator's in-product loop for generating an exam. Source text and notes go into a session opener; the agent reads the rulebook and craft ledger; the exam-build command or its in-product studio drafts a sketch and stops for human sign-off; the exam is assembled from a skeleton and validated, then run through a simulator with error bars and preflights. Findings go to the craft ledger; when it holds, a human sits the exam and the sitting is reviewed.</desc>
