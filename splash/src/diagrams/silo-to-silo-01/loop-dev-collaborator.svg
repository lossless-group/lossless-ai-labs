<svg class="s2s-svg" data-diagram="loop-dev-collaborator" focusable="false" viewBox="0 0 884 652" role="img" lang="en" aria-labelledby="s2s-loop-dev-collaborator-archify-diagram-title s2s-loop-dev-collaborator-archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="s2s-loop-dev-collaborator-archify-diagram-title">The Collaborator: developer loop</title>
        <desc id="s2s-loop-dev-collaborator-archify-diagram-description">The Collaborator's developer loop in four lanes. A signed-off design doc, a session that starts cold with no instruction file, implementation, the verify skill with node tests and an ad-hoc browser drive, a measured commit, then merge and deploy. Memory is the git log, and sometimes a what-shipped section in the design doc.</desc>
