        <title id="dvi-loop-product-instadeck-archify-diagram-title">Instadeck: in-product loop (customer uploads, pipeline generates)</title>
        <desc id="dvi-loop-product-instadeck-archify-diagram-description">Instadeck's in-product loop. A customer uploads a deck; the pipeline reviews and researches it, writes the Markdown document chain up to 06-DESIGN.md, and authors whole-deck HTML from per-slide files. Chromium proves the render: a measured failure goes to a repair skill and back, a pass publishes an immutable DesignVersion. One result per run.</desc>
