        <title id="dvi-loop-dev-instadeck-archify-diagram-title">Instadeck: developer loop</title>
        <desc id="dvi-loop-dev-instadeck-archify-diagram-description">Instadeck's developer loop in four lanes. A spec or dated decision, a Codex brief, one branch per concern, contract tests and CI, a pull request squash-merged to main, gate, rollback and review records, then a Railway deploy with migrations first. The reasons for a change live in PR titles and dated docs.</desc>
