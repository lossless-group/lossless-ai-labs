        <title id="dvi-loop-product-dididecks-archify-diagram-title">dididecks-ai: in-product loop (operator drives Claude Code)</title>
        <desc id="dvi-loop-product-dididecks-archify-diagram-description">The dididecks-ai in-product loop. An operator brings source material; Claude Code writes the DESIGN.md and ingests people and companies, writes a narrative file per slide, and builds the whole deck as one Scroll-UI page. A human ranks each slot in place: a weak slot gets a new variant and goes back, a strong one is recreated as a 16:9 Play-UI file and exported.</desc>
